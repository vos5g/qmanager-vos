name: VOS release (ARMv7 binaries)

# Builds the QManager binary for the Tri Cascade VOS 5G / SG500M2-X (SDX55,
# ARMv7) and a "Tailscale Tiny" binary, and publishes them with checksums.
#   - push a tag like  vos-v1.0.0, or publish a release with such a tag in the
#     web UI                      -> binaries attached to that GitHub release
#   - run by hand (Actions tab)     -> build only, binaries kept as artifacts
on:
  push:
    tags: ['vos-v*']
  workflow_dispatch:
    inputs:
      tailscale_version:
        description: "Tailscale version for the Tiny build (empty = latest stable)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - uses: actions/setup-go@v6
        with:
          go-version: '1.24'
          cache-dependency-path: backend/go.sum

      - name: Build web UI (Next.js static export)
        env:
          NEXT_TELEMETRY_DISABLED: '1'
        run: |
          npm ci --no-audit --no-fund
          npx next build
          rm -rf backend/web/out && mkdir -p backend/web/out
          cp -r out/. backend/web/out/

      - name: Test and build qmanager-core (linux/armv7)
        working-directory: backend
        run: |
          go test ./...
          mkdir -p ../dist
          # a release build shows its own version (vos-v1.1.0 -> v1.1.0) on the dashboard
          VER=""
          case "$GITHUB_REF_NAME" in vos-v*) VER="-X qmanager-backend/pkg/daemon.qmanagerVersionFallback=${GITHUB_REF_NAME#vos-}" ;; esac
          CGO_ENABLED=0 GOOS=linux GOARCH=arm GOARM=7 \
            go build -trimpath -ldflags="-s -w $VER" -o ../dist/qmanager-core-armv7 ./cmd/server

      - name: Build Tailscale Tiny (linux/armv7, from Tailscale's own source)
        # Optional: a Tailscale build problem must not hold back the QManager
        # release (the binary is then left out and the notes say so).
        continue-on-error: true
        env:
          TS_VER_IN: ${{ inputs.tailscale_version }}
          # Tailscale moves to new Go releases quickly (1.104 needs Go 1.27.3);
          # setup-go sets GOTOOLCHAIN=local, so let this step fetch the Go
          # version Tailscale's go.mod asks for.
          GOTOOLCHAIN: auto
        run: |
          VER="${TS_VER_IN:-$(curl -fsSL 'https://pkgs.tailscale.com/stable/?mode=json' | sed -n 's/.*"TarballsVersion": *"\([^"]*\)".*/\1/p')}"
          test -n "$VER"
          git clone --depth 1 --branch "v$VER" https://github.com/tailscale/tailscale.git /tmp/ts
          cd /tmp/ts
          FEATURES=osrouter,nattraversal,portmapper,listenrawdisco,advertiseexitnode,advertiseroutes,useexitnode,useroutes,health,ipnbus,debug
          TAGS="$(GOOS= GOARCH= go run ./cmd/featuretags --min --add=$FEATURES),ts_include_cli"
          eval "$(CGO_ENABLED=0 GOOS= GOARCH= go run ./cmd/mkversion)"
          CGO_ENABLED=0 GOOS=linux GOARCH=arm GOARM=7 go build -tags="$TAGS" -trimpath \
            -ldflags "-s -w -X tailscale.com/version.longStamp=$VERSION_LONG -X tailscale.com/version.shortStamp=$VERSION_SHORT" \
            -o "$GITHUB_WORKSPACE/dist/tailscaled-tiny-armv7" ./cmd/tailscaled
          echo "$VER" > "$GITHUB_WORKSPACE/dist/tailscale-tiny.version"

      - name: Checksums
        working-directory: dist
        run: |
          sha256sum qmanager-core-armv7 $(ls tailscaled-tiny-armv7 2>/dev/null) > SHA256SUMS.txt
          cat SHA256SUMS.txt
          ls -l

      - uses: actions/upload-artifact@v6
        with:
          name: vos-armv7-binaries
          path: dist/

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/vos-v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if [ -f dist/tailscaled-tiny-armv7 ]; then
            TS=$(cat dist/tailscale-tiny.version)
            TSLINE="- tailscaled-tiny-armv7: Tailscale $TS built from Tailscale's own source with unused
            features left out (single binary, CLI built in). Install with install.sh --tailscale-tiny."
          else
            TSLINE="- Tailscale Tiny could not be built for this release; use the Official Tailscale
            install from the Tailscale page, or the tailscaled-tiny-armv7 from an earlier release."
          fi
          cat > notes.md <<NOTES
          ARMv7 binaries for the Tri Cascade VOS 5G / SG500M2-X (Compal RXM-G1, SDX55).

          - qmanager-core-armv7: QManager (evairo176 UI) ported to the Compal modem; needs qcmd and
            vosclean from https://github.com/vos5g/vos5g-sdx55 (install.sh does both).
          $TSLINE

          Check downloads against SHA256SUMS.txt. QManager is MIT with Commons Clause (not for sale).
          NOTES
          # release-notes/<tag>.md, when present: its "# " first line is the
          # release title and the rest replaces the generic notes above (the
          # binaries paragraph is appended so the downloads stay explained)
          TITLE="$TAG"
          if [ -f "release-notes/$TAG.md" ]; then
            T=$(sed -n '1s/^# //p' "release-notes/$TAG.md")
            [ -n "$T" ] && TITLE="$T"
            { sed '1{/^# /d}' "release-notes/$TAG.md"; printf '\n## 📦 Downloads\n\n'; cat notes.md; } > notes-full.md
            mv notes-full.md notes.md
          fi
          FILES="dist/qmanager-core-armv7 $(ls dist/tailscaled-tiny-armv7 2>/dev/null) dist/SHA256SUMS.txt"
          if gh release view "$TAG" >/dev/null 2>&1; then
            # release drafted/published in the web UI: just attach the binaries
            gh release upload "$TAG" $FILES --clobber
          else
            gh release create "$TAG" $FILES --title "$TITLE" --notes-file notes.md
          fi
